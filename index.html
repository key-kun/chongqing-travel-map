<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14233e">
 <title>重庆 · 旅行规划与影像地图</title><meta name="description" content="重庆旅行规划：选地点、按天安排、保存和分享，查看视频关键帧与核验记录。">
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2314233e'/%3E%3Cpath d='M12 14a8 8 0 1 1 16 0c0 6-8 15-8 15s-8-9-8-15' fill='%23f66b4d'/%3E%3Ccircle cx='20' cy='14' r='3' fill='white'/%3E%3C/svg%3E">
 <link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="vendor/MarkerCluster.css"><link rel="stylesheet" href="vendor/MarkerCluster.Default.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="planner.css">
 <script defer src="vendor/leaflet.js"></script><script defer src="vendor/leaflet.markercluster.js"></script><script defer src="data.js"></script><script defer src="user-location.js"></script><script defer src="vendor/lz-string.min.js"></script><script defer src="trip-core.js"></script><script defer src="trip-planner.js"></script><script defer src="app.js"></script>
</head>
<body>
 <header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">渝</span><div><h1>重庆 <span>旅行规划</span></h1><p>地点与影像</p></div></div><nav aria-label="地图范围"><button data-scope="city" class="active">主城</button><button data-scope="all">全部点位</button><button data-scope="大足">大足</button><button data-scope="武隆">武隆</button></nav><div id="plan-manager" class="plan-manager"></div><div class="report-date">资料核验 <b id="report-date"></b></div></header>
 <main class="workspace">
  <aside class="sidebar" id="sidebar" aria-label="地点列表">
   <div class="sidebar-head"><div class="library-tabs"><button type="button" data-library-view="list" aria-pressed="true">找地点</button><button type="button" data-library-view="favorites" aria-pressed="false">想去</button></div><div class="sidebar-heading"><h2>找到一个地点</h2><button id="hide-list" class="mobile-only icon-button" aria-label="收起地点列表">×</button></div><div class="search-row"><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索地点、片区或原报告编号" aria-label="搜索地点"></label><button id="toggle-filters" class="mobile-only filter-toggle" aria-expanded="false" aria-controls="filter-panel">筛选</button></div><div id="filter-panel"><div class="filters"><select id="region" aria-label="按片区筛选"><option value="">所有片区</option></select><select id="category" aria-label="按类型筛选"><option value="">所有类型</option><option>景点</option><option>机位</option><option>美食</option><option>交通</option></select></div></div><div class="status-tabs" role="group" aria-label="定位状态"><button data-status="all" class="active">全部 <span></span></button><button data-status="located">已定位 <span></span></button><button data-status="unresolved">待定位 <span></span></button></div><p id="result-count" class="result-count" aria-live="polite"></p></div>
   <div id="point-list" class="point-list"></div><div class="sidebar-foot"><button id="all-frames" class="gallery-link">查看全部 84 张关键帧 ↗</button><p class="sidebar-disclaimer">截图源于历史视频，开放和进入条件请看核验说明。</p></div>
  </aside>
  <section class="map-stage" aria-label="重庆真实地图"><div id="map"></div><button id="show-list" class="mobile-only map-list-toggle">地点列表</button><div class="map-tools"><div class="map-caption" id="map-caption"></div><div class="marker-display" role="group" aria-label="标记显示"><span>标记显示</span><button type="button" data-marker-mode="category" aria-pressed="true">分类字</button><button type="button" data-marker-mode="name" aria-pressed="false">地点名</button></div><p id="route-note" class="route-note" hidden>顺序示意，非实际交通路线</p></div><div class="map-banner" id="map-status" role="status" hidden><span id="map-status-text"></span><button id="retry-map">重试底图</button></div><div class="location-control" aria-label="当前位置"><div class="location-panel" id="location-panel" hidden><p id="location-message" role="status" aria-live="polite"></p><button type="button" id="clear-location">清除位置</button></div><button type="button" id="locate-me" class="locate-button" aria-label="定位到我的位置" aria-controls="location-panel" aria-busy="false" title="获取本次位置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3"/></svg><span>我的位置</span></button></div><div class="map-key"><span class="key-dot" style="--key:#1769ba"></span>景点 <span class="key-dot" style="--key:#8c4acd"></span>机位 <span class="key-dot" style="--key:#e36b2c"></span>美食 <span class="key-dot" style="--key:#008577"></span>交通</div></section>
  <aside id="favorites-panel" class="favorites-panel" aria-label="想去清单"></aside><aside id="planner-panel" class="planner-panel" aria-label="每日行程"></aside><aside id="detail" class="detail" aria-label="地点详情"><div class="sheet-controls"><button id="expand-detail" aria-expanded="false" aria-controls="detail-content">展开详情 <span aria-hidden="true">⌃</span></button><button id="mobile-close-detail" class="icon-button" aria-label="收起详情，返回上一页">×</button></div><div id="detail-content" class="detail-content"><div class="detail-empty"><span class="empty-mark" aria-hidden="true">◎</span><h2>从地图打开一段影像</h2><p>点击地图上的点，或从左侧选择地点，查看它的关键帧和核验记录。</p><img src="frames/n0519.jpg" alt="视频中的洪崖洞夜景关键帧"><small>关键帧 · 08:39 · 千厮门大桥视角</small><div class="empty-note">待定位记录也能在列表中查看图片。</div></div></div></aside>
 </main>
 <nav id="mobile-nav" class="mobile-nav" aria-label="手机页面导航"><button data-mobile-view="map" aria-pressed="true"><span class="nav-symbol" aria-hidden="true">◎</span><span>地图</span></button><button data-mobile-view="list" aria-pressed="false"><span class="nav-symbol" aria-hidden="true">⌕</span><span>找地点</span></button><button data-mobile-view="favorites" aria-pressed="false"><span class="nav-symbol" aria-hidden="true">♡</span><span>想去</span></button><button data-mobile-view="plan" aria-pressed="false"><span class="nav-symbol" aria-hidden="true">☷</span><span>行程</span></button></nav><button id="mobile-detail" hidden disabled></button>
 <div id="planner-toast" class="planner-toast" role="status" aria-live="polite" hidden></div><div id="save-state" class="save-state" role="status" aria-live="polite"></div>
 <div id="pick-panel" class="pick-panel" hidden><p id="pick-text"></p><button id="confirm-pick" disabled>确认位置</button><button id="cancel-pick">取消标点</button></div>
 <input type="file" id="import-trip" accept="application/json,.json" hidden><dialog id="planner-dialog" class="planner-dialog" aria-label="行程操作"></dialog>
 <dialog id="lightbox" aria-label="关键帧原图"><div class="lightbox-top"><p id="lightbox-title"></p><button id="close-lightbox" aria-label="关闭原图">×</button></div><div class="lightbox-canvas"><img id="lightbox-image" alt=""><div id="lightbox-error" hidden>图片暂时无法打开。可关闭后重试。</div></div><p class="lightbox-touch-hint">左右滑动切换图片</p><footer class="lightbox-bottom"><button id="prev-frame" aria-label="上一张">上一张</button><span id="lightbox-index"></span><button id="actual-size">原尺寸</button><button id="next-frame" aria-label="下一张">下一张</button></footer></dialog>
 <noscript>需要启用浏览器 JavaScript 才能使用地图。</noscript>
</body></html>
