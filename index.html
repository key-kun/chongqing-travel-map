<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14233e">
 <title>重庆 · 地点与影像地图</title><meta name="description" content="重庆视频旅行资料地图，按地点查看关键帧与核验记录。">
 <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2314233e'/%3E%3Cpath d='M12 14a8 8 0 1 1 16 0c0 6-8 15-8 15s-8-9-8-15' fill='%23f66b4d'/%3E%3Ccircle cx='20' cy='14' r='3' fill='white'/%3E%3C/svg%3E">
 <link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="vendor/MarkerCluster.css"><link rel="stylesheet" href="vendor/MarkerCluster.Default.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css">
 <script defer src="vendor/leaflet.js"></script><script defer src="vendor/leaflet.markercluster.js"></script><script defer src="data.js"></script><script defer src="app.js"></script>
</head>
<body>
 <header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">渝</span><div><h1>重庆 <span>地点与影像</span></h1><p>视频资料地图</p></div></div><nav aria-label="地图范围"><button data-scope="city" class="active">主城</button><button data-scope="all">全部点位</button><button data-scope="大足">大足</button><button data-scope="武隆">武隆</button></nav><div class="report-date">资料核验 <b id="report-date"></b></div></header>
 <main class="workspace">
  <aside class="sidebar" id="sidebar" aria-label="地点列表">
   <div class="sidebar-head"><div class="sidebar-heading"><h2>找到一个地点</h2><button id="hide-list" class="mobile-only icon-button" aria-label="收起地点列表">×</button></div><div class="search-row"><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索地点、片区或原报告编号" aria-label="搜索地点"></label><button id="toggle-filters" class="mobile-only filter-toggle" aria-expanded="false" aria-controls="filter-panel">筛选</button></div><div id="filter-panel"><div class="filters"><select id="region" aria-label="按片区筛选"><option value="">所有片区</option></select><select id="category" aria-label="按类型筛选"><option value="">所有类型</option><option>景点</option><option>机位</option><option>美食</option><option>交通</option></select></div></div><div class="status-tabs" role="group" aria-label="定位状态"><button data-status="all" class="active">全部 <span></span></button><button data-status="located">已定位 <span></span></button><button data-status="unresolved">待定位 <span></span></button></div><p id="result-count" class="result-count" aria-live="polite"></p></div>
   <div id="point-list" class="point-list"></div><div class="sidebar-foot"><button id="all-frames" class="gallery-link">查看全部 84 张关键帧 ↗</button><p class="sidebar-disclaimer">截图源于历史视频，开放和进入条件请看核验说明。</p></div>
  </aside>
  <section class="map-stage" aria-label="重庆真实地图"><div id="map"></div><button id="show-list" class="mobile-only map-list-toggle">地点列表</button><div class="map-banner" id="map-status" role="status" hidden><span id="map-status-text"></span><button id="retry-map">重试底图</button></div><div class="map-key"><span class="key-dot" style="--key:#1769ba"></span>景点 <span class="key-dot" style="--key:#8c4acd"></span>机位 <span class="key-dot" style="--key:#e36b2c"></span>美食 <span class="key-dot" style="--key:#008577"></span>交通</div><div class="map-caption" id="map-caption"></div></section>
  <aside id="detail" class="detail" aria-label="地点详情"><div class="sheet-controls"><button id="expand-detail" aria-expanded="false" aria-controls="detail-content">展开详情 <span aria-hidden="true">⌃</span></button><button id="mobile-close-detail" class="icon-button" aria-label="收起详情，返回地图">×</button></div><div id="detail-content" class="detail-content"><div class="detail-empty"><span class="empty-mark" aria-hidden="true">◎</span><h2>从地图打开一段影像</h2><p>点击地图上的点，或从左侧选择地点，查看它的关键帧和核验记录。</p><img src="frames/n0519.jpg" alt="视频中的洪崖洞夜景关键帧"><small>关键帧 · 08:39 · 千厮门大桥视角</small><div class="empty-note">待定位记录也能在列表中查看图片。</div></div></div></aside>
 </main>
 <nav id="mobile-nav" class="mobile-nav" aria-label="手机页面导航"><button data-mobile-view="map" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z M9 3v15 M15 6v15"/></svg><span>地图</span></button><button data-mobile-view="list" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><span>找地点</span></button><button id="mobile-detail" data-mobile-view="detail" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></svg><span>详情</span></button></nav>
 <dialog id="lightbox" aria-label="关键帧原图"><div class="lightbox-top"><p id="lightbox-title"></p><button id="close-lightbox" aria-label="关闭原图">×</button></div><div class="lightbox-canvas"><img id="lightbox-image" alt=""><div id="lightbox-error" hidden>图片暂时无法打开。可关闭后重试。</div></div><p class="lightbox-touch-hint">左右滑动切换图片</p><footer class="lightbox-bottom"><button id="prev-frame" aria-label="上一张">上一张</button><span id="lightbox-index"></span><button id="actual-size">原尺寸</button><button id="next-frame" aria-label="下一张">下一张</button></footer></dialog>
 <noscript>需要启用浏览器 JavaScript 才能使用地图。</noscript>
</body></html>
